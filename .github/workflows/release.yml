name: Release

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Release tag to publish (leave empty for build only)"
        required: false
        type: string
        default: ""
  push:
    tags:
      - "**"

permissions:
  contents: write

jobs:
  release:
    if: ${{ !startsWith(github.ref_name, 'runtime-') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate manual release target
        if: ${{ github.event_name == 'workflow_dispatch' }}
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          if [[ "$RELEASE_TAG" == runtime-* ]]; then
            echo "runtime- tags are reserved for pinned runtime dependencies" >&2
            exit 1
          fi

      - name: Select versioned release notes
        id: release_notes
        if: ${{ (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')) || (github.event_name == 'workflow_dispatch' && inputs.release_tag != '') }}
        run: |
          version=$(sed -n 's/^factorioVersionName=//p' gradle.properties | tr -d '\r')
          notes="docs/releases/${version}.md"
          if [[ -z "$version" || ! -s "$notes" ]]; then
            echo "Missing release notes for APK version: $version ($notes)" >&2
            exit 1
          fi
          echo "path=$notes" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3
        with:
          # The action defaults to the retired SDK "tools" package.
          packages: platform-tools

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager --install "platforms;android-36" "build-tools;36.0.0"

      - name: Cache Gradle dependencies
        uses: actions/cache@v4
        with:
          path: |
            .cache/gradle/caches
            .cache/gradle/wrapper
          key: ${{ runner.os }}-gradle9-${{ hashFiles('**/*.gradle.kts', 'gradle/wrapper/gradle-wrapper.properties') }}

      - name: Build launcher packages
        env:
          GITHUB_TOKEN: ${{ github.token }}
          FACTORIO_KEYSTORE_BASE64: ${{ secrets.FACTORIO_KEYSTORE_BASE64 }}
          FACTORIO_KEY_ALIAS: ${{ secrets.FACTORIO_KEY_ALIAS }}
          FACTORIO_KEYSTORE_PASSWORD: ${{ secrets.FACTORIO_KEYSTORE_PASSWORD }}
          FACTORIO_KEY_PASSWORD: ${{ secrets.FACTORIO_KEY_PASSWORD }}
        run: ./scripts/build.sh --performance-package

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: launcher-apks
          path: |
            artifacts/*.apk
            artifacts/build-result.json
            artifacts/host-tests.xml
          if-no-files-found: error

      - name: Publish release
        if: ${{ (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')) || (github.event_name == 'workflow_dispatch' && inputs.release_tag != '') }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag || github.ref_name }}
          target_commitish: ${{ github.sha }}
          body_path: ${{ steps.release_notes.outputs.path }}
          files: |
            artifacts/*.apk
            artifacts/build-result.json
          fail_on_unmatched_files: true
